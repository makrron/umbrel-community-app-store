tagline: Collaborative cloud-based LaTeX editor
description: >-
  Overleaf (Community Edition) is a collaborative cloud-based LaTeX editor used for writing, editing, and publishing scientific and technical documents.


  ### First-time Setup

  After launching Overleaf for the first time, navigate to `/launchpad` in your browser to create your initial administrator account.


  ### Key Features

  - Real-time collaborative document editing

  - Direct LaTeX compilation with instant PDF preview

  - Rich text and source view modes

  - Document history and version comparison

  - Project file and asset management

