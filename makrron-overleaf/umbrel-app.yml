category: developer
name: Overleaf
version: "6.3.0-patch.4"
tagline: Collaborative self-hosted LaTeX editor
description: >-
  Overleaf (Community Edition) is a powerful self-hosted, collaborative online LaTeX editor designed to make scientific, academic, and technical writing seamless. Author papers, thesis projects, and presentations with real-time compilation, dual editing modes, and direct local storage on your Umbrel.


  ### ✨ Key Features

  - **Real-Time Collaboration**: Work simultaneously with colleagues and co-authors on the same document.

  - **Instant PDF Preview**: Side-by-side LaTeX compilation to inspect results as you type.

  - **Dual Editor Modes**: Effortlessly switch between visual Rich Text mode and direct LaTeX source code.

  - **Project Management**: Organize chapters, images, and BibTeX bibliographies in an integrated file tree.

  - **100% Private & Self-Hosted**: All documents and assets remain under your control on your Umbrel server.


  ### 🛠️ First-Time Setup

  After launching Overleaf for the first time, navigate to `/launchpad` in your browser (e.g. `http://<umbrel-ip>:8185/launchpad`) to create your primary administrator account.


  ### 📦 TeX Live Packages & Extras

  The Community Edition container ships with a minimal TeX Live installation for fast startup and low resource consumption.

  This app includes an automated background hook (`hooks/post-start`) that automatically restores your required TeX Live packages whenever the app starts or updates:

  - Packages listed in `data/texlive-packages.txt` (by default `babel-spanish`, `titlesec`, and common LaTeX collections) are automatically verified and installed in the background.

  - To add more packages permanently across any container update, simply add package names (one per line) to `data/texlive-packages.txt`.

  - You can inspect installation progress anytime in `data/texlive-install.log`.
releaseNotes: >-
  - Switched to multi-architecture image (ghcr.io/makrron/overleaf:6.3.0) with native support for both ARM64 (Raspberry Pi 4/5, Umbrel Home) and x86_64 servers.

  - Added automated background post-start hook to ensure custom TeX Live packages (like babel-spanish and titlesec) are automatically restored and preserved across app updates.

  - Added umbrelOS 2.0 storage management support (storage.dataRoot: data).


  Previous Overleaf 6.3.0 release notes:


  - Overleaf Community Edition v6.3.0 on Umbrel.

  - Modernized app icon with official Overleaf branding, solid background, and balanced geometry.

  - Enhanced app store description with detailed setup and TeX Live package management instructions.
