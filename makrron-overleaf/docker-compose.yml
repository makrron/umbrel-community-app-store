version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: makrron-overleaf_server_1
      APP_PORT: 80

  server:
    image: sharelatex/sharelatex:6.3.0@sha256:d2c20ae595d64f61dca224864b90a5594fb71df0c20c014c2dcaae595f2de7d8
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ${APP_DATA_DIR}/data/sharelatex:/var/lib/sharelatex
    environment:
      SHARELATEX_APP_NAME: Overleaf Community Edition
      SHARELATEX_SITE_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      SHARELATEX_NAV_TITLE: Overleaf
      SHARELATEX_MONGO_URL: mongodb://makrron-overleaf_mongo_1:27017/sharelatex
      SHARELATEX_REDIS_HOST: makrron-overleaf_redis_1
      REDIS_HOST: makrron-overleaf_redis_1
      ENABLED_LINKED_FILE_TYPES: 'project_file,project_output_file'
      ENABLE_CONVERSIONS: 'true'
      EMAIL_CONFIRMATION_DISABLED: 'true'
      TEXMFVAR: /var/lib/sharelatex/tmp/texmf-var
      OVERLEAF_BEHIND_PROXY: 'true'
      OVERLEAF_INVITE_TOKEN_SECRET: ${APP_MAKRRON_OVERLEAF_INVITE_SECRET}

  mongo:
    image: mongo:6.0@sha256:8b6d8f5bbedb25cb73517b65cf99f13aeb75ad5b157a56c479287a840bbad3ac
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/mongo:/data/db
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine@sha256:ccd6aa8d45ff3f033d6fa15b8cc1a50579f65c89f38cf9bb607a954c4f2128ed
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
